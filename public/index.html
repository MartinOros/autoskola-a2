<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Autoškola A2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Autoškola A2</title>
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--text:#14171c;--muted:#6b7280;--line:#e5e7eb;
  --accent:#1d4ed8;--accent-soft:#e0e7ff;--star:#f59e0b;--ok:#15803d;--ok-soft:#dcfce7;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1115;--card:#181b21;--text:#e8eaee;--muted:#9aa1ad;--line:#2a2e36;
  --accent:#6b8cff;--accent-soft:#1e2742;--star:#fbbf24;--ok:#4ade80;--ok-soft:#14321f;
}}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto}
.bar h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.icon-btn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:22px}
.icon-btn:active{background:var(--line)}
main{max-width:760px;margin:0 auto;padding:12px 16px calc(env(safe-area-inset-bottom) + 90px)}
.list{display:flex;flex-direction:column;gap:8px}
.cat{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:14px;text-align:left;width:100%}
.cat .num{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none}
.cat .t{flex:1;min-width:0}
.cat .t b{display:block;font-weight:600}
.cat .t small{color:var(--muted)}
.cat .badge{color:var(--star);font-weight:600;font-size:14px;white-space:nowrap}
.cat.marked .num{background:var(--star);color:#fff}
.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.search{flex:1 1 100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit}
.seg{display:flex;background:var(--line);border-radius:10px;padding:3px;flex:1}
.seg button{flex:1;padding:7px 6px;border-radius:8px;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--text);font-weight:600}
.q{background:var(--card);border-radius:14px;padding:14px;position:relative}
.q .head{display:flex;gap:10px;align-items:flex-start}
.q .n{color:var(--muted);font-size:13px;font-weight:600;min-width:30px;padding-top:2px}
.q .text{flex:1;font-weight:600}
.q img{display:block;max-width:100%;max-height:260px;margin:10px auto 0;border-radius:8px;background:#fff}
.star{font-size:24px;line-height:1;color:var(--line);padding:2px 4px;margin:-4px -6px 0 0}
.star.on{color:var(--star)}
.ans{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--ok-soft);color:var(--text)}
.ans::before{content:"✓ ";color:var(--ok);font-weight:700}
.ans.hidden{background:var(--line);color:transparent;user-select:none;cursor:pointer;position:relative}
.ans.hidden::before{color:transparent}
.ans.hidden::after{content:"Ťukni pre odpoveď";position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px}
.tag{display:inline-block;font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 5px;vertical-align:2px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 16px);background:var(--accent);color:#fff;border-radius:999px;padding:13px 22px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);white-space:nowrap}
.section{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:18px 4px 8px}
/* flashcards */
.card{background:var(--card);border-radius:18px;padding:18px;min-height:50vh;display:flex;flex-direction:column}
.card .meta{color:var(--muted);font-size:13px;display:flex;justify-content:space-between;margin-bottom:10px}
.card .text{font-size:19px;font-weight:600}
.card img{display:block;align-self:center;max-width:100%;max-height:38vh;margin:10px auto 0;border-radius:8px;background:#fff;object-fit:contain}
.card .ans{font-size:17px}
.actions{display:flex;gap:10px;margin-top:14px}
.actions button{flex:1;padding:14px;border-radius:14px;font-weight:600;background:var(--card)}
.actions .primary{background:var(--accent);color:#fff}
.actions .good{background:var(--ok);color:#fff}
.progress{height:4px;background:var(--line);border-radius:4px;margin-bottom:12px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
</style>
</head>
<body>
<header><div class="bar">
  <button class="icon-btn" id="back" hidden aria-label="Späť">‹</button>
  <h1 id="title">Autoškola A2</h1>
  <button class="icon-btn" id="menu" aria-label="Kategórie" title="Kategórie">☰</button>
</div></header>
<main id="app"></main>
<script src="questions.js"></script>
<script>
const KEY='a2-marked-v1', PREF='a2-prefs-v1';
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
let inFlash=false, DATA, marked=new Set(load(KEY,[])), prefs=load(PREF,{hide:false,filter:'all'});
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function toggleMark(id){marked.has(id)?marked.delete(id):marked.add(id);save(KEY,[...marked])}
const otazok=n=>n+' '+(n===1?'otázka':n>=2&&n<=4?'otázky':'otázok');
function setTitle(t,back){$('#title').textContent=t;$('#back').hidden=!back}

function qCard(q){
  const on=marked.has(q.id);
  return `<div class="q" data-id="${q.id}">
    <div class="head"><span class="n">${q.n}.</span><div class="text">${esc(q.q)}${q.g?` <span class="tag">${esc(q.g)}</span>`:''}</div>
    <button class="star ${on?'on':''}" data-star="${q.id}" aria-label="Označiť">${on?'★':'☆'}</button></div>
    ${q.qi?`<img loading="lazy" src="img/${q.qi}" alt="">`:''}
    <div class="ans ${prefs.hide?'hidden':''}">${esc(q.a)}${q.ai?`<img loading="lazy" src="img/${q.ai}" alt="">`:''}</div>
  </div>`;
}

function home(){
  setTitle('Autoškola A2',false);
  const m=DATA.qs.filter(q=>marked.has(q.id)).length;
  app.innerHTML=`<div class="list">
    <button class="cat marked" data-go="#/marked"><span class="num">★</span><span class="t"><b>Označené na učenie</b><small>${otazok(m)}</small></span></button>
    <div class="section">Kategórie</div>
    ${DATA.cats.map((c,i)=>{const qs=DATA.qs.filter(q=>q.cat===i+1),mk=qs.filter(q=>marked.has(q.id)).length;
      return `<button class="cat" data-go="#/cat/${i+1}"><span class="num">${i+1}</span><span class="t"><b>${esc(c)}</b><small>${otazok(qs.length)}</small></span>${mk?`<span class="badge">★ ${mk}</span>`:''}</button>`}).join('')}
  </div>`;
}

function listView(title,qs,{grouped=false,key}={}){
  setTitle(title,true);
  app.innerHTML=`<div class="tools">
    <input class="search" id="search" type="search" placeholder="Hľadať v otázkach a odpovediach…" >
    ${key==='marked'?'':`<div class="seg" id="filter"><button data-f="all">Všetky</button><button data-f="marked">★ Označené</button></div>`}
    <div class="seg" id="hide"><button data-h="0">Odpovede</button><button data-h="1">Skryť</button></div>
  </div><div class="list" id="qs"></div>
  <button class="fab" id="learn">▶ Precvičovať</button>`;
  const render=()=>{
    const term=norm($('#search').value.trim());
    let v=qs; if(key!=='marked'&&prefs.filter==='marked') v=v.filter(q=>marked.has(q.id));
    if(term) v=v.filter(q=>norm(q.q+' '+q.a+' '+q.n).includes(term));
    $('#filter')?.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.f===prefs.filter));
    $('#hide').querySelectorAll('button').forEach(b=>b.classList.toggle('on',(b.dataset.h==='1')===prefs.hide));
    let html='',last=0;
    for(const q of v){ if(grouped&&q.cat!==last){last=q.cat;html+=`<div class="section">${q.cat}. ${esc(DATA.cats[q.cat-1])}</div>`} html+=qCard(q) }
    $('#qs').innerHTML=html||`<div class="empty">${key==='marked'?'Zatiaľ nemáš nič označené.<br>Ťukni na ☆ pri otázke.':'Nič sa nenašlo.'}</div>`;
    $('#learn').hidden=!v.length; $('#learn').onclick=()=>flash(title,v);
  };
  $('#search').oninput=render;
  $('#filter')&&($('#filter').onclick=e=>{const f=e.target.dataset.f;if(f){prefs.filter=f;save(PREF,prefs);render()}});
  $('#hide').onclick=e=>{const h=e.target.dataset.h;if(h){prefs.hide=h==='1';save(PREF,prefs);render()}};
  render();
}

function flash(title,list){
  let deck=[...list].sort(()=>Math.random()-.5), i=0, shown=false;
  const draw=()=>{
    if(i>=deck.length){app.innerHTML=`<div class="card"><div class="empty"><b>Hotovo ✓</b><br>Prešiel si ${otazok(deck.length)}.</div>
      <div class="actions"><button class="primary" id="again">Znova</button><button id="done">Späť</button></div></div>`;
      $('#again').onclick=()=>flash(title,list); $('#done').onclick=()=>route(); return;}
    const q=deck[i], on=marked.has(q.id);
    app.innerHTML=`<div class="progress"><i style="width:${i/deck.length*100}%"></i></div>
    <div class="card"><div class="meta"><span>${i+1} / ${deck.length} · kat. ${q.cat}, č. ${q.n}</span>
      <button class="star ${on?'on':''}" data-star="${q.id}">${on?'★':'☆'}</button></div>
      <div class="text">${esc(q.q)}</div>${q.qi?`<img src="img/${q.qi}" alt="">`:''}
      <div class="ans ${shown?'':'hidden'}" id="a">${esc(q.a)}${q.ai?`<img src="img/${q.ai}" alt="">`:''}</div></div>
    <div class="actions">${shown
      ?`<button id="again">Ešte nie</button><button class="good" id="know">Viem ${on?'(odznačiť)':''}</button>`
      :`<button class="primary" id="show">Ukáž odpoveď</button>`}</div>`;
    const reveal=()=>{shown=true;draw()};
    $('#show')&&($('#show').onclick=reveal); $('#a').onclick=()=>!shown&&reveal();
    $('#know')&&($('#know').onclick=()=>{if(marked.has(q.id))toggleMark(q.id);i++;shown=false;draw()});
    $('#again')&&($('#again').onclick=()=>{if(!marked.has(q.id))toggleMark(q.id);deck.push(q);i++;shown=false;draw()});
  };
  inFlash=true; setTitle('Precvičovanie',true); draw();
}

function route(){
  inFlash=false; scrollTo(0,0); const h=location.hash;
  let m;
  if(h==='#/marked') listView('★ Označené',DATA.qs.filter(q=>marked.has(q.id)),{grouped:true,key:'marked'});
  else if(m=h.match(/^#\/cat\/(\d+)/)) listView(`${m[1]}. ${DATA.cats[m[1]-1]}`,DATA.qs.filter(q=>q.cat===+m[1]));
  else home();
}

document.addEventListener('click',e=>{
  const s=e.target.closest('[data-star]');
  if(s){const id=s.dataset.star;toggleMark(id);const on=marked.has(id);s.classList.toggle('on',on);s.textContent=on?'★':'☆';return}
  const a=e.target.closest('.q .ans.hidden'); if(a){a.classList.remove('hidden');return}
  const g=e.target.closest('[data-go]'); if(g) location.hash=g.dataset.go;
});
$('#back').onclick=()=>{if(inFlash)return route();location.hash.startsWith('#/')&&history.length>1?history.back():(location.hash='')};
$('#menu').onclick=()=>{location.hash=''};
addEventListener('hashchange',route);

DATA=window.QDATA; route();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
